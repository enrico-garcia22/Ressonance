<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Resenha - Resonance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button id="btn-menu" aria-label="Abrir menu de navegação">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <h1><a href="index.html">Ressonance</a></h1>
    </header>

    <div class="app-container">
        <!-- BARRA LATERAL -->
        <aside id="menu-lateral" class="fechado">
            <section class="perfil-usuario">
                <figure>
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                    <figcaption><a href="meu-perfil.html" id="nome-perfil-sidebar" style="color: inherit; text-decoration: none;">Meu Perfil</a></figcaption>
                </figure>
            </section>
            <nav aria-label="Menu principal">
                <ul>
                    <li><a href="minhas-resenhas.html">Suas Resenhas</a></li>
                    <li><a href="adicionar-resenha.html">Adicionar Resenha</a></li>
                </ul>
            </nav>
            <div class="menu-footer">
                <a href="#" id="btn-sair">Sair</a>
            </div>
        </aside>

        <main class="container-add-resenha">
            <h2 class="titulo-pagina">Adicionar Resenha</h2>
            
            <div class="caixa-formulario">
                
                <!-- 1. Campo do Álbum (com container relativo para o dropdown) -->
                <div class="grupo-input relativo">
                    <input type="text" id="input-album" class="input-escuro" placeholder="Digite o nome do álbum" autocomplete="off">
                    <div id="lista-autocomplete" class="dropdown-autocomplete"></div>
                </div>

                <!-- 2. Barra de Rolagem (Nota) -->
                <div class="grupo-input flex-row">
                    <div class="label-nota">Barra de rolagem</div>
                    <input type="range" id="range-nota" class="input-range" min="1" max="5" step="0.5" value="3">
                    <span id="display-nota" class="valor-nota">3.0</span>
                </div>

                <!-- 3. Área da Resenha -->
                <div class="grupo-input">
                    <textarea id="txt-resenha" class="input-escuro textarea-resenha" placeholder="Digite a resenha do álbum"></textarea>
                </div>
                
                <button id="btn-enviar-resenha" class="btn-enviar">ENVIAR</button>
            </div>
        </main>
    </div>

    <script src="barralat.js"></script>
    <script src="dados.js"></script>
    <script src="adicionar-resenha.js"></script>
</body>
</html>
