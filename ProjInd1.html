<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ressonance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button id="btn-menu" aria-label="Abrir menu de navegação">
            <!--efeito para aparecer a barra lateral-->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <h1>Ressonance</h1>
    </header>

    <div class="app-container">
        
        <!-- barra lateral -->
        <aside id="menu-lateral" class="fechado">
            <section class="perfil-usuario">
                <figure>
                    <!-- Ícone de perfil SVG -->
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                    <figcaption>Nome do Perfil</figcaption>
                </figure>
            </section>

            <nav aria-label="Menu principal">
                <ul>
                    <li><a href="#resenhas">Suas Resenhas</a></li>
                    <li><a href="#adicionar">Adicionar Resenha</a></li>
                </ul>
            </nav>

            <div class="menu-footer">
                <a href="#sair">Sair</a>
            </div>
        </aside>

        <!-- conteúdo principal-->
        <main>
            <section class="grade- albuns">
                <article class="cartao-album">
                    <figure class="capa-placeholder">
                        <figcaption>Imagem do álbum</figcaption>
                    </figure>
                    <h3>Nome do álbum</h3>
                    <div class="estrelas" aria-label="Avaliação: 5 de 5 estrelas">
                        ★★★★★
                    </div>
                </article>
            </section>
        </main>

    </div>
    <script src="script.js"></script>
</body>
</html>
